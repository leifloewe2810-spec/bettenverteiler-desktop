<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>IPAS Bettenverteiler</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card { padding: 32px; max-width: 420px; }
    h1 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
    p { margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .spin {
      margin: 20px auto 0;
      width: 24px; height: 24px;
      border: 2px solid #334155;
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: r 0.9s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Fallback-Seite. Wenn Tauri uns ueber `url` direkt auf die Server-URL
    // lenkt, sehen wir das hier nie. Andernfalls (z.B. lokaler Dev): nach
    // 1 s auf die Live-Seite redirecten.
    setTimeout(() => {
      window.location = "https://bettenverteiler.lionsgroup-trading.com/";
    }, 1000);
  </script>
</head>
<body>
  <div class="card">
    <h1>IPAS Bettenverteiler</h1>
    <p>Wird geladen …</p>
    <div class="spin"></div>
  </div>
</body>
</html>
